  } catch (e) {
    showToast('导出失败: ' + e.message, 'error');
  }
}

function editRecordById(recordId) {
  dbGetByKey('transactions', recordId).then(record => {
    if (!record) {
      showToast('记录不存在', 'error');
      return;
    }
    editingRecordId = recordId;
    const bodyHTML = `
      <div class="form-grid">
        <div class="form-field">
          <label>金额</label>
          <input type="number" id="editAmount" step="0.01" value="${record.amount}">
        </div>
        <div class="form-field">
          <label>类型</label>
          <select id="editType" onchange="updateEditCategoryOptions()">
            <option value="收入" ${record.type === '收入' ? 'selected' : ''}>收入</option>
            <option value="支出" ${record.type === '支出' ? 'selected' : ''}>支出</option>
          </select>
        </div>
        <div class="form-field">
          <label>分类</label>
          <select id="editCategory"></select>
        </div>
        <div class="form-field">
          <label>日期</label>
          <input type="date" id="editDate" value="${record.date}">
        </div>
        <div class="form-field" style="grid-column: span 2">
          <label>描述</label>
          <div class="desc-input-wrapper">
            <input type="text" id="editDescription" value="${(record.description || '').replace(/"/g, '&quot;')}" autocomplete="off">
            <div class="desc-dropdown" id="editDescDropdown"></div>
          </div>
        </div>
      </div>
    `;
    document.getElementById('editModalBody').innerHTML = bodyHTML;
    document.getElementById('editModalOverlay').classList.add('active');
    updateEditCategoryOptions();
    const editCat = document.getElementById('editCategory');
    if ([...editCat.options].some(o => o.value === record.category)) {
      editCat.value = record.category;
    }
    editModalDirty = false;
    ['editAmount', 'editType', 'editCategory', 'editDate', 'editDescription'].forEach(id => {
      const el = document.getElementById(id);
      if (el) {
        el.addEventListener('input', () => { editModalDirty = true; });
        el.addEventListener('change', () => { editModalDirty = true; });
      }
    });
    initEditDescAutocomplete();
  });
}

// ============================================================
//  搜索记录（高级查询）
// ============================================================
function openSearchRecords() {
  const today = new Date();
  const firstDay = new Date(today.getFullYear(), today.getMonth(), 1);

  const bodyHTML = `
    <div class="search-controls">
      <div class="form-field">
        <label>开始日期</label>
        <input type="date" id="srStartDate" value="${firstDay.toISOString().slice(0,10)}">
      </div>
      <div class="form-field">
        <label>结束日期</label>
        <input type="date" id="srEndDate" value="${today.toISOString().slice(0,10)}">
      </div>
      <div class="form-field">
        <label>类型</label>
        <select id="srType" onchange="updateSearchCategoryOptions()">
          <option value="">全部</option>
          <option value="收入">收入</option>
          <option value="支出">支出</option>
        </select>
      </div>
      <div class="form-field">
        <label>分类</label>
        <select id="srCategory">
          <option value="">全部</option>
          ${ALL_CATEGORIES.map(c => `<option value="${c}">${c}</option>`).join('')}
        </select>
      </div>
      <div class="form-field">
        <label>关键词（描述）</label>
        <input type="text" id="srKeyword" placeholder="搜索描述内容">
      </div>
      <div class="form-field">
        <label>金额筛选</label>
        <div style="display:flex;gap:4px;align-items:center;">
          <input type="number" id="srMinAmount" placeholder="最小" step="0.01" style="width:50%;">
          <span>-</span>
          <input type="number" id="srMaxAmount" placeholder="最大" step="0.01" style="width:50%;">
        </div>
      </div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center;">
      <button class="btn btn-primary btn-sm" onclick="performSearch()">查询记录</button>
      <button class="btn btn-secondary btn-sm" onclick="selectAllSearchPage()">全选当前页</button>
      <button class="btn btn-secondary btn-sm" onclick="exportSearchResults()">导出查询记录</button>
      <button class="btn btn-secondary btn-sm" onclick="exportSelectedRecords()">导出选中记录</button>
      <button class="btn btn-danger btn-sm" onclick="deleteSelectedRecords()">删除选中记录</button>
    </div>
    <div id="srTotalInfo" style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:8px;"></div>
    <div class="table-wrapper" style="max-height:360px">
      <table class="data-table" id="srTable">
        <thead><tr>
          <th class="sortable" data-sort="amount" onclick="sortSearchBy('amount')">金额</th>
          <th class="sortable" data-sort="type" onclick="sortSearchBy('type')">类型</th>
          <th class="sortable" data-sort="category" onclick="sortSearchBy('category')">分类</th>
          <th class="sortable" data-sort="date" onclick="sortSearchBy('date')">日期</th>
          <th class="sortable" data-sort="description" onclick="sortSearchBy('description')">描述</th>
        </tr></thead>
        <tbody id="srTableBody"></tbody>
      </table>
    </div>
    <div class="pagination-bar">
      <label>每页显示：</label>
      <select id="srPageSize" onchange="updatePageSize()">
        <option value="10">10</option>
        <option value="20" selected>20</option>
        <option value="50">50</option>
        <option value="100">100</option>
      </select>
      <button class="btn btn-secondary btn-sm" id="srPrevBtn" onclick="changePage(-1)">上一页</button>
      <span id="srPageLabel">第1页</span>
      <button class="btn btn-secondary btn-sm" id="srNextBtn" onclick="changePage(1)">下一页</button>
      <label>跳转到：</label>
      <input type="number" id="srPageJump" min="1" style="width:60px">
      <button class="btn btn-secondary btn-sm" onclick="jumpToPage()">跳转</button>
    </div>
    <p style="color:gray;font-size:0.85rem;margin-top:8px;">提示：按住Ctrl点击可多选，按住Shift可范围选择，双击行可编辑</p>
  `;
  openModal('高级查询', bodyHTML);
  // 初始化
  currentPage = 1;
  pageSize = 20;
  document.getElementById('srPageSize').value = '20';
  performSearch();
}

function updateSearchCategoryOptions() {
  const type = document.getElementById('srType').value;
  const sel = document.getElementById('srCategory');
  if (type === '收入') {
    sel.innerHTML = '<option value="">全部</option>' + INCOME_CATEGORIES.map(c => `<option value="${c}">${c}</option>`).join('');
  } else if (type === '支出') {
    sel.innerHTML = '<option value="">全部</option>' + EXPENSE_CATEGORIES.map(c => `<option value="${c}">${c}</option>`).join('');
  } else {
    sel.innerHTML = '<option value="">全部</option>' + ALL_CATEGORIES.map(c => `<option value="${c}">${c}</option>`).join('');
  }
}

function changePage(delta) {
  const newPage = currentPage + delta;
  if (newPage < 1) return;
  currentPage = newPage;
  performSearch();
}

function updatePageSize() {
  const newSize = parseInt(document.getElementById('srPageSize').value);
  if (newSize > 0) {
    pageSize = newSize;
    currentPage = 1;
    performSearch();
  }
}

function jumpToPage() {
  const pageNum = parseInt(document.getElementById('srPageJump').value);
  if (isNaN(pageNum) || pageNum < 1 || pageNum > totalPages) {
    showToast(`页码需在1到${totalPages}之间`, 'error');
    return;
  }
  currentPage = pageNum;
  performSearch();
}

async function performSearch() {
  const startDate = document.getElementById('srStartDate').value;
  const endDate = document.getElementById('srEndDate').value;
  const selType = document.getElementById('srType').value;
  const selCategory = document.getElementById('srCategory').value;
  const keyword = document.getElementById('srKeyword').value.trim().toLowerCase();
  const minAmount = parseFloat(document.getElementById('srMinAmount').value);
  const maxAmount = parseFloat(document.getElementById('srMaxAmount').value);

  if (startDate && endDate && startDate > endDate) {
    showToast('结束日期不能早于开始日期', 'error');
    return;
  }

  try {
    const transactions = await getUserTransactions(currentUser.id);
    let filtered = transactions;
    if (startDate && endDate) {
      filtered = filtered.filter(t => t.date >= startDate && t.date <= endDate);
    }
    if (selType) {
      filtered = filtered.filter(t => t.type === selType);
    }
    if (selCategory) {
      filtered = filtered.filter(t => t.category === selCategory);
    }
    if (keyword) {
      filtered = filtered.filter(t => (t.description || '').toLowerCase().includes(keyword));
    }
    if (!isNaN(minAmount)) {
      filtered = filtered.filter(t => t.amount >= minAmount);
    }
    if (!isNaN(maxAmount)) {
      filtered = filtered.filter(t => t.amount <= maxAmount);
    }
    
    allFilteredResults = filtered;
    applySortAndRender();
  } catch (e) {
    showToast('查询错误: ' + e.message, 'error');
  }
}

function applySortAndRender() {
  let filtered = [...allFilteredResults];
  
  // 排序
  const field = searchSortField;
  const asc = searchSortAsc;
  filtered.sort((a, b) => {
    let va = a[field], vb = b[field];
    if (field === 'amount') {
      va = parseFloat(va); vb = parseFloat(vb);
    } else {
      va = String(va || ''); vb = String(vb || '');
    }
    if (va < vb) return asc ? -1 : 1;
    if (va > vb) return asc ? 1 : -1;
    return 0;
  });

  // 更新列头排序标记
  document.querySelectorAll('#srTable thead th.sortable').forEach(th => {
    th.classList.remove('sort-asc', 'sort-desc');
    if (th.dataset.sort === searchSortField) {
      th.classList.add(searchSortAsc ? 'sort-asc' : 'sort-desc');
    }
  });

  totalRecords = filtered.length;
  totalPages = Math.max(1, Math.ceil(totalRecords / pageSize));
  if (currentPage > totalPages) currentPage = totalPages;

  // 显示总记录数
  const totalInfo = document.getElementById('srTotalInfo');
  if (totalRecords > 0) {
    totalInfo.textContent = `共 ${totalRecords} 条记录，当前第 ${currentPage}/${totalPages} 页`;
  } else {
    totalInfo.textContent = '';
  }

  // 更新分页控件
  document.getElementById('srPageLabel').textContent = `第${currentPage}页/共${totalPages}页`;
  document.getElementById('srPrevBtn').disabled = currentPage <= 1;
  document.getElementById('srNextBtn').disabled = currentPage >= totalPages;

  // 分页
  const offset = (currentPage - 1) * pageSize;
  const pageData = filtered.slice(offset, offset + pageSize);
  searchResults = pageData;

  const body = document.getElementById('srTableBody');
  body.innerHTML = '';
  if (pageData.length === 0) {
    body.innerHTML = '<tr><td colspan="5" style="color:gray;padding:20px;">没有找到匹配的记录</td></tr>';
    return;
  }
  for (const r of pageData) {
    body.insertAdjacentHTML('beforeend', `<tr data-id="${r.id}" oncontextmenu="showContextMenu(event, ${r.id})">
      <td>${r.amount.toFixed(2)}</td>
      <td>${r.type}</td>
      <td>${r.category}</td>
      <td>${r.date}</td>
      <td>${r.description || ''}</td>
    </tr>`);
  }
  // 行选中事件（支持Ctrl多选、Shift范围选择）
  document.querySelectorAll('#srTableBody tr').forEach((tr, idx) => {
    tr.addEventListener('click', (e) => {
      const rows = [...document.querySelectorAll('#srTableBody tr')];
      if (e.shiftKey && shiftSelectStart !== null) {
        // Shift范围选择
        const startIdx = shiftSelectStart;
        const endIdx = idx;
        const lo = Math.min(startIdx, endIdx);
        const hi = Math.max(startIdx, endIdx);
        rows.forEach((r, i) => {
          if (i >= lo && i <= hi) r.classList.add('row-selected');
        });
        return;
      }
      if (!e.ctrlKey && !e.metaKey) {
        rows.forEach(r => r.classList.remove('row-selected'));
      }
      tr.classList.add('row-selected');
      shiftSelectStart = idx;
    });
    // 双击编辑
    tr.addEventListener('dblclick', () => {
      const rid = parseInt(tr.dataset.id);
      document.querySelectorAll('#srTableBody tr').forEach(r => r.classList.remove('row-selected'));
      tr.classList.add('row-selected');
      editSelectedRecord();
    });
  });
}

function sortSearchBy(field) {
  if (searchSortField === field) {
    searchSortAsc = !searchSortAsc;
  } else {
    searchSortField = field;
    searchSortAsc = true;
  }
  applySortAndRender();
}

function showContextMenu(event, recordId) {
  event.preventDefault();
  // 选中当前行
  const tr = event.currentTarget;
  if (!tr.classList.contains('row-selected')) {
    document.querySelectorAll('#srTableBody tr').forEach(r => r.classList.remove('row-selected'));
    tr.classList.add('row-selected');
  }
  const menu = document.getElementById('contextMenu');
  menu.style.display = 'block';
  menu.style.left = event.clientX + 'px';
  menu.style.top = event.clientY + 'px';
}

// 关闭右键菜单
document.addEventListener('click', () => {
  document.getElementById('contextMenu').style.display = 'none';
});

function getSelectedRecordIds() {
  return [...document.querySelectorAll('#srTableBody tr.row-selected')].map(tr => parseInt(tr.dataset.id));
}

function editSelectedRecord() {
  const ids = getSelectedRecordIds();
  if (ids.length === 0) {
    showToast('请先选择要编辑的记录', 'error');
    return;
  }
  editRecordById(ids[0]);
}

function updateEditCategoryOptions() {
  const type = document.getElementById('editType').value;
  const sel = document.getElementById('editCategory');
  const cats = type === '收入' ? INCOME_CATEGORIES : EXPENSE_CATEGORIES;
  sel.innerHTML = cats.map(c => `<option value="${c}">${c}</option>`).join('');
}

async function saveEditedRecord() {
  if (!editingRecordId) return;
  try {
    const amount = parseFloat(document.getElementById('editAmount').value);
    if (isNaN(amount) || amount <= 0) {
      showToast('金额必须为正数', 'error');
      return;
    }
    const type = document.getElementById('editType').value;
    const category = document.getElementById('editCategory').value;
    // 校验分类-类型匹配
    const validCats = type === '收入' ? INCOME_CATEGORIES : EXPENSE_CATEGORIES;
    if (!validCats.includes(category)) {
      showToast('分类与类型不匹配', 'error');
      return;
    }
    const date = document.getElementById('editDate').value;
    const description = document.getElementById('editDescription').value.trim();
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) {
      showToast('日期格式无效', 'error');
      return;
    }

    const record = await dbGetByKey('transactions', editingRecordId);
    record.amount = amount;
    record.type = type;
    record.category = category;
    record.date = date;
    record.description = description;
    await dbUpdate('transactions', record);
    showToast('记录已更新', 'success');
    closeEditModal();
    // 若搜索弹窗打开着，同步刷新搜索结果
    if (document.getElementById('srStartDate')) performSearch();
    renderOverview();
    // 若收支明细弹窗打开着，同步刷新
    if (document.getElementById('rlTableBody')) refreshRecordList();
  } catch (e) {
    showToast('更新失败: ' + e.message, 'error');
  }
}

async function deleteSelectedRecords() {
  const ids = getSelectedRecordIds();
  if (ids.length === 0) {
    showToast('请先选择要删除的记录', 'error');
    return;
  }
  showConfirm('确认删除', `确定要删除选中的 ${ids.length} 条记录吗？此操作不可撤销。`, async () => {
    try {
      for (const id of ids) {
        await dbDelete('transactions', id);
      }
      showToast(`${ids.length}条记录已删除`, 'success');
      renderOverview();
      // 若搜索弹窗打开着，同步刷新搜索结果
      if (document.getElementById('srStartDate')) performSearch();
      // 若收支明细弹窗打开着，同步刷新
      if (document.getElementById('rlTableBody')) refreshRecordList();
    } catch (e) {
      showToast('删除失败: ' + e.message, 'error');
    }
  });
}

function selectAllSearchPage() {
  const rows = document.querySelectorAll('#srTableBody tr');
  if (rows.length === 0) {
    showToast('当前没有记录可选', 'error');
    return;
  }
  const allSelected = [...rows].every(r => r.classList.contains('row-selected'));
  rows.forEach(r => r.classList.toggle('row-selected', !allSelected));
}

function exportSearchResults() {
  if (!allFilteredResults || allFilteredResults.length === 0) {
    showToast('请先执行查询操作', 'error');
    return;
  }
  try {
    const data = allFilteredResults.map(r => ({
      amount: r.amount.toFixed(2),
      type: r.type,
      category: r.category,
      date: r.date,
      description: r.description || ''
    }));
    const ws = XLSX.utils.json_to_sheet(data, { header: ['amount', 'type', 'category', 'date', 'description'] });
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
    XLSX.writeFile(wb, '搜索结果导出.xlsx');
    showToast(`成功导出${allFilteredResults.length}条记录`, 'success');
  } catch (e) {
    showToast('导出失败: ' + e.message, 'error');
  }
}

async function exportSelectedRecords() {
  const ids = getSelectedRecordIds();
  if (ids.length === 0) {
    showToast('请先选择要导出的记录', 'error');
    return;
  }
  try {
    const allTx = await getUserTransactions(currentUser.id);
    const selected = allTx.filter(t => ids.includes(t.id));
    const data = selected.map(r => ({
      amount: r.amount.toFixed(2),
      type: r.type,
      category: r.category,
      date: r.date,
      description: r.description || ''
    }));
    const ws = XLSX.utils.json_to_sheet(data, { header: ['amount', 'type', 'category', 'date', 'description'] });
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
    XLSX.writeFile(wb, '选中记录导出.xlsx');
    showToast(`成功导出${selected.length}条选中记录`, 'success');
  } catch (e) {
    showToast('导出失败: ' + e.message, 'error');
  }
}

// ============================================================
//  键盘快捷键 + 回车登录
// ============================================================
document.addEventListener('keydown', (e) => {
  // 登录页回车
  if (document.getElementById('loginPage').style.display !== 'none') {
    if (e.key === 'Enter') {
      const active = document.activeElement;
      if (active && active.id === 'loginPassword') {
        handleLogin(document.getElementById('loginBtn'));
      } else if (active && active.id === 'loginUsername') {
        document.getElementById('loginPassword').focus();
      }
    }
  }
  // 主应用回车提交新增记录
  if (document.getElementById('appPage').classList.contains('active') &&
      !document.getElementById('modalOverlay').classList.contains('active') &&
      !document.getElementById('editModalOverlay').classList.contains('active')) {
    if (e.key === 'Enter') {
      const active = document.activeElement;
      if (active && ['inpAmount', 'inpDescription', 'inpDate'].includes(active.id)) {
        e.preventDefault();
        addTransaction(document.getElementById('addRecordBtn'));
      }
    }
  }
  // Ctrl+A 全选查询结果
  if (e.ctrlKey && (e.key === 'a' || e.key === 'A')) {
    const srTable = document.getElementById('srTableBody');
    if (srTable && document.getElementById('modalOverlay').classList.contains('active')) {
      e.preventDefault();
      document.querySelectorAll('#srTableBody tr').forEach(tr => tr.classList.add('row-selected'));
    }
  }
  // ESC 关闭弹窗
  if (e.key === 'Escape') {
    if (document.getElementById('confirmOverlay').classList.contains('active')) {
      closeConfirmModal();
    } else if (document.getElementById('subModalOverlay').classList.contains('active')) {
      closeSubModal();
    } else if (document.getElementById('editModalOverlay').classList.contains('active')) {
      closeEditModal();
    } else if (document.getElementById('modalOverlay').classList.contains('active')) {
      closeModal();
    }
  }
});

// ============================================================
//  启动
// ============================================================
init();
</script>
